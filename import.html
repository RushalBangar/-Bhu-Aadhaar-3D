<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import GeoJSON to Firebase</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #0B0F19; color: white; }
        .container { max-width: 600px; margin: 0 auto; background: #161F30; padding: 20px; border-radius: 8px; }
        input[type="file"] { margin: 20px 0; }
        button { padding: 10px 20px; background: #2563EB; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #3B82F6; }
        #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 4px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Import Building Footprints</h2>
        <p>Select the <code>footprints.geojson</code> file downloaded from Overpass Turbo.</p>
        <input type="file" id="fileInput" accept=".geojson,application/json">
        <button id="importBtn">Import to Firebase</button>
        <div id="log"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrZWLQKmOIZ9fkcOpQSyjkvXp2wqkxl7M",
            authDomain: "bhu-aadhaar-3d.firebaseapp.com",
            projectId: "bhu-aadhaar-3d",
            storageBucket: "bhu-aadhaar-3d.firebasestorage.app",
            messagingSenderId: "994213836556",
            appId: "1:994213836556:web:6dfc234346eedc4df2fb29",
            measurementId: "G-P27GQZKEQ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const logEl = document.getElementById('log');
        function log(msg) {
            logEl.innerHTML += `<div>${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        document.getElementById('importBtn').addEventListener('click', () => {
            const file = document.getElementById('fileInput').files[0];
            if (!file) {
                log('Please select a file first.');
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const geojson = JSON.parse(e.target.result);
                    log(`Loaded JSON with ${geojson.features ? geojson.features.length : 0} features.`);
                    
                    if (!geojson.features) {
                        log('Invalid GeoJSON: Missing features array.');
                        return;
                    }

                    // Process each feature
                    for (const feature of geojson.features) {
                        // For demonstration, we just mock the 2D ULPIN and other fields since Overpass doesn't have them
                        const mockUlpin2d = "14MH" + Math.floor(Math.random() * 10000000000).toString().padStart(10, '0');
                        
                        // 1. Insert into parcels table
                        try {
                            const parcelDocRef = await addDoc(collection(db, 'parcels'), {
                                ulpin_2d: mockUlpin2d,
                                survey_number: `S-${Math.floor(Math.random() * 1000)}`,
                                state: 'Maharashtra',
                                district: 'Pune',
                                taluka: 'Pune City',
                                village: 'Shivajinagar',
                                boundary_geojson: JSON.stringify(feature.geometry)
                            });

                            // 2. Insert into buildings table
                            await addDoc(collection(db, 'buildings'), {
                                parcel_id: parcelDocRef.id,
                                building_name: feature.properties.name || `Building ${parcelDocRef.id.substring(0,4)}`,
                                total_floors: feature.properties['building:levels'] ? parseInt(feature.properties['building:levels']) : Math.floor(Math.random() * 10) + 2,
                                basement_floors: 1,
                                height_meters: feature.properties.height ? parseFloat(feature.properties.height) : (Math.floor(Math.random() * 10) + 2) * 3,
                                footprint_geojson: JSON.stringify(feature.geometry)
                            });

                            log(`Successfully imported building for parcel: ${mockUlpin2d}`);
                        } catch (err) {
                            log(`Error inserting data: ${err.message}`);
                        }
                    }
                    log('Import complete!');
                } catch (err) {
                    log(`Error parsing file: ${err.message}`);
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
