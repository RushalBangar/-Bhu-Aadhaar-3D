<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Water Amenities to Firebase</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #0B0F19; color: white; }
        .container { max-width: 600px; margin: 0 auto; background: #161F30; padding: 20px; border-radius: 8px; }
        input[type="file"] { margin: 20px 0; }
        button { padding: 10px 20px; background: #2563EB; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #3B82F6; }
        #log { margin-top: 20px; background: #000; padding: 10px; border-radius: 4px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Import Drinking Water Points</h2>
        <p>Select the <code>drinking_water.geojson</code> file downloaded from Overpass.</p>
        <input type="file" id="fileInput" accept=".geojson,application/json">
        <button id="importBtn">Import to Firebase</button>
        <div id="log"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrZWLQKmOIZ9fkcOpQSyjkvXp2wqkxl7M",
            authDomain: "bhu-aadhaar-3d.firebaseapp.com",
            projectId: "bhu-aadhaar-3d",
            storageBucket: "bhu-aadhaar-3d.firebasestorage.app",
            messagingSenderId: "994213836556",
            appId: "1:994213836556:web:6dfc234346eedc4df2fb29",
            measurementId: "G-P27GQZKEQ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const logEl = document.getElementById('log');
        function log(msg) {
            logEl.innerHTML += `<div>${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        document.getElementById('importBtn').addEventListener('click', () => {
            const file = document.getElementById('fileInput').files[0];
            if (!file) {
                log('Please select a file first.');
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const geojson = JSON.parse(e.target.result);
                    log(`Loaded JSON with ${geojson.features ? geojson.features.length : 0} features.`);
                    
                    if (!geojson.features) {
                        log('Invalid GeoJSON: Missing features array.');
                        return;
                    }

                    let successCount = 0;

                    // Process each feature
                    for (const feature of geojson.features) {
                        const amenityType = feature.properties.amenity || 'unknown';
                        const name = feature.properties.name || null;
                        
                        // Insert into amenities table
                        try {
                            await addDoc(collection(db, 'amenities'), {
                                amenity_type: amenityType,
                                name: name,
                                location_geojson: feature.geometry
                            });
                            successCount++;
                            if (successCount % 10 === 0) {
                                log(`Imported ${successCount} amenities...`);
                            }
                        } catch (error) {
                            log(`Error inserting ${amenityType} (${name}): ${error.message}`);
                        }
                    }
                    log(`Import complete! Successfully imported ${successCount} amenities.`);
                } catch (err) {
                    log(`Error parsing file: ${err.message}`);
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
